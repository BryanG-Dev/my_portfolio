<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow-x: hidden;
      width: 100%;
      background-color: #f4f4f4;  
    }

    .top {
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #3976b4;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #2d5e8f;
    }

    .btn:active {
      transform: translateY(1px);
    }

     
    .resume-wrapper {
      width: 100%;
       
      height: calc(100vh - 85px); 
      overflow: auto;
      -webkit-overflow-scrolling: touch; 
      background: #525659;  
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <div class="top">
    <a class="btn" href="../bgresume2026.pdf" download>
        Download Resume
    </a>
  </div>

  <div class="resume-wrapper">
    <iframe src="../bgresume2026.pdf"></iframe>
  </div>

</body>
</html>

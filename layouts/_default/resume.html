<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0f172a;
      color: white;
    }

    .top {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      background: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
    }

    iframe {
      width: 100vw;
      height: calc(100vh - 140px);
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <div class="top">
    <h1>Resume</h1>

    <a class="btn" href="/bgresume2026.pdf" download>
      ⬇ Download Resume
    </a>
  </div>

  <iframe src="/bgresume2026.pdf"></iframe>

</body>
</html>

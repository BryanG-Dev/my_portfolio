<div id="floating-nav" class="floating-nav">
 <a href="#top" style="
    display: block;
    text-align: center;
    color: #333;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 25px;
    padding: 5px 20px 0px 20px;
">↑</a>
  <a href="#about">About Me</a>
  <a href="#experience">Experience</a>
  <a href="#education">Education</a>
  <a href="#projects">Projects</a>
   <a href="#bottom" style="
    display: block;
    text-align: center;
    color: #333;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 25px;
    padding: 0px 20px 5px 20px;
">↓</a>
</div>

<script>
(function () {
  const nav = document.getElementById("floating-nav");
  if (!nav) return;

  let lastScrollY = window.scrollY;
  let lastInteractionY = window.scrollY;

  let isLocked = false;
  let lockTimeout = null;

  const isMobile = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  const upThreshold = isMobile ? 40 : 0;
  const downThreshold = isMobile ? 10 : 0;

  function closeAllDetails() {
    document.querySelectorAll(".project-details.open")
      .forEach(el => el.classList.remove("open"));

    document.querySelectorAll(".toggle-btn").forEach(btn => {
      const details = btn.nextElementSibling;
      if (!details || !details.classList.contains("project-details")) return;

      if (!details.classList.contains("open")) {
        btn.textContent = "Show Details";
      }
    });
  }

  function hideAndLockNav() {
    nav.classList.remove("visible");
    isLocked = true;

    if (lockTimeout) clearTimeout(lockTimeout);

    lockTimeout = setTimeout(() => {
      isLocked = false;
      lastScrollY = window.scrollY;
    }, 1500);
  }

  function toggleAccordion(toggleBtn) {
    lastInteractionY = window.scrollY;
    
    const details = toggleBtn.nextElementSibling;
    if (details && details.classList.contains("project-details")) {
      const isOpen = details.classList.toggle("open");
      toggleBtn.textContent = isOpen ? "Hide Details" : "Show Details";
    }

    hideAndLockNav();
  }

  // --- VIDEO QUAD LOGIC ---
  function activateNativeControls(wrapper) {
    hideAndLockNav();
    lastInteractionY = window.scrollY; // Set interaction baseline on play

    const quad = wrapper.querySelector(".video-touch-overlay");
    if (quad) quad.classList.add("disabled");
  }

  // --- UPDATED VIDEO QUAD LOGIC ---
  function initVideoQuads() {
    document.querySelectorAll(".video-wrapper").forEach(wrapper => {
      const video = wrapper.querySelector("video");
      const quad = wrapper.querySelector(".video-touch-overlay");

      if (!video || !quad) return;

      function handleActivation(e) {
        if (!video.paused) return;
        if (e) e.preventDefault();
        activateNativeControls(wrapper);
        video.play().catch(err => console.log("Playback error:", err));
      }

      // 1. Clicking the custom overlay button
      quad.addEventListener("click", handleActivation);

      // 2. Tapping anywhere directly on the video element itself
      video.addEventListener("click", handleActivation);

      // 3. THE MAGIC BULLET: Whenever the video starts playing for ANY reason 
      // (native controls, API, etc.), instantly hide the quad.
      video.addEventListener("play", () => {
        activateNativeControls(wrapper);
      });

      // Native controls trigger pause -> bring quad back
      video.addEventListener("pause", () => quad.classList.remove("disabled"));
      video.addEventListener("ended", () => quad.classList.remove("disabled"));

      // ChapterGrid buttons inside/associated with wrapper hide quad
      const chapterButtons = wrapper.querySelectorAll(".chapter-btn, [data-timestamp]");
      chapterButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          activateNativeControls(wrapper);
        });
      });
    });
  }

  // Global Quad & Video Reset on Scroll
  function resetAllVideoQuads(autoPause = false) {
    document.querySelectorAll(".video-wrapper").forEach(wrapper => {
      const video = wrapper.querySelector("video");
      const quad = wrapper.querySelector(".video-touch-overlay");

      // Re-enable touch quad overlay
      if (quad) quad.classList.remove("disabled");

      // Auto-pause playing video when scrolled out of range
      if (autoPause && video && !video.paused) {
        video.pause();
      }
    });
  }

  // Bind direct touch/click handlers with debounce guard
  function initButtons() {
    document.querySelectorAll(".toggle-btn").forEach(btn => {
      let lastTapTime = 0;

      const handlePress = function (e) {
        const now = Date.now();
        if (now - lastTapTime < 300) return;
        lastTapTime = now;

        toggleAccordion(btn);
      };

      btn.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") {
          handlePress(e);
        }
      });

      btn.addEventListener("click", function (e) {
        if (e.pointerType !== "touch") {
          handlePress(e);
        }
      });
    });

    // Initialize video quad listeners
    initVideoQuads();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initButtons);
  } else {
    initButtons();
  }

  function onScroll() {
    const current = window.scrollY;
    const delta = current - lastScrollY;
    const pastHero = current > 300;

    if (!isLocked) {
      if (delta < -upThreshold && pastHero) {
        nav.classList.add("visible");
      } else if (delta > downThreshold || !pastHero) {
        nav.classList.remove("visible");
      }
    }

   // Measure distance scrolled since last accordion or video tap
    const scrollDelta = Math.abs(current - lastInteractionY);

    // Trigger purely based on distance, regardless of scroll direction
    if (scrollDelta > 450) {
      // 1. Close open accordion panels
      if (document.querySelector(".project-details.open")) {
        closeAllDetails();
      }

      // 2. Reset quads and pause running videos independently of accordions
      const disabledQuads = document.querySelectorAll(".video-touch-overlay.disabled");
      if (disabledQuads.length > 0) {
        resetAllVideoQuads(true);
      }
    }

    lastScrollY = current;
  }

  window.addEventListener("scroll", onScroll);
})();
</script>

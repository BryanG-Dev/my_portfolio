<div 
  id="custom-top-nav" 
  class="pointer-events-none fixed inset-x-0 top-0 z-50 flex flex-col items-center justify-start"
  style="height: 0; overflow: visible;"
>
  <style>
    /* SHARED GLASS PANEL STYLE FOR BOTH TOP NAV AND DROPDOWN */
    #custom-top-nav .top-horizontal-nav,
    #detachedProjectDropdown {
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      background: color-mix(in srgb, rgba(96, 165, 250, 0.05), currentColor 10%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }

    .dark #custom-top-nav .top-horizontal-nav,
    .dark #detachedProjectDropdown {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    /* Top Nav Specifics */
    #custom-top-nav .top-horizontal-nav {
      margin-top: 16px !important;
      width: calc(100% - 2rem) !important;
      max-width: 42rem !important;
      padding: 1.5rem 1.5rem 1.0rem 1.5rem !important; 
      border-radius: 14px !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translateY(-20px) !important;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out, visibility 0.3s ease-out !important;
      will-change: transform, opacity, backdrop-filter !important;
    }

    #custom-top-nav.nav-is-open .top-horizontal-nav {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      transform: translateY(0px) !important;
    }

    #custom-top-nav .top-nav-container {
      position: relative !important;
      width: 100% !important;
    }

    #custom-top-nav .top-nav-flex-row {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: space-between !important; 
      width: 100% !important;
      gap: 4px !important; 
    }

    @media (min-width: 480px) {
      #custom-top-nav .top-nav-flex-row {
        gap: 12px !important;
      }
    }

    #custom-top-nav .nav-top-link {
      color: var(--color-neutral-100, white) !important;
      text-decoration: none !important;
      font-size: 0.8rem !important; 
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      display: inline-block !important;
      padding: 6px 4px !important;
      margin: 0 !important; 
      white-space: nowrap !important;
      transition: all 0.2s ease !important;
      touch-action: manipulation !important;
    }

    @media (min-width: 480px) {
      #custom-top-nav .nav-top-link {
        font-size: 0.95rem !important;
        padding: 6px 12px !important;
      }
    }

    #custom-top-nav .nav-top-link:hover {
      transform: scale(1.05) !important;
      opacity: 0.85 !important;
    }

    #custom-top-nav .nav-dropdown-wrapper {
      position: relative !important;
      display: inline-block !important;
    }

    #custom-top-nav .top-arrow-hitbox {
      display: inline-block !important;
      text-align: center !important;
      font-weight: bold !important;
      font-size: 16px !important;
      text-decoration: none !important;
      color: var(--color-neutral-100, white) !important; 
      padding: 4px 6px !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
      touch-action: manipulation !important;
    }

    @media (min-width: 480px) {
      #custom-top-nav .top-arrow-hitbox {
        font-size: 20px !important;
        padding: 0px 8px 4px 8px !important;
      }
    }

    #custom-top-nav .top-arrow-hitbox:hover {
      transform: scale(1.05) !important;
    }

    #custom-top-nav .close-top-btn {
      position: absolute !important;
      background: none !important;
      border: none !important;
      color: #a3a3a3 !important;
      cursor: pointer !important;
      margin: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: color 0.2s ease, transform 0.2s ease !important;
      touch-action: manipulation !important;
    }
    #custom-top-nav .close-top-btn:hover {
      color: #e5e5e5 !important;
      transform: scale(1.05) !important;
    }

    @media (max-width: 479px) {
      #custom-top-nav .close-top-btn {
        right: -1.05rem !important; 
        top: -1.9rem !important; 
        font-size: 1.0rem !important; 
        padding: 4px !important;
      }
    }

    @media (min-width: 480px) {
      #custom-top-nav .close-top-btn {
        right: -2.6rem !important; 
        top: -2.0rem !important; 
        font-size: 1rem !important;  
        padding: 6px !important;
      }
      #custom-top-nav .top-horizontal-nav {
        padding-right: 2.8rem !important; 
      }
    }

    /* BREATHING ROOM ABOVE SECTIONS WHEN SCROLLING */
    #about, 
    #experience, 
    #education, 
    #projects {
      scroll-margin-top: 100px !important;
    }
  </style>

  <!-- TOP NAV CONTAINER -->
  <div class="top-horizontal-nav">
    <div class="top-nav-container">
      <button id="close-top-nav" class="close-top-btn" aria-label="Close Navigation">✕</button>

      <div class="top-nav-flex-row">
        <a href="#about" class="nav-top-link">About Me</a>
        <a href="#experience" class="nav-top-link">Experience</a>
        <a href="#education" class="nav-top-link">Education</a>
        
        <div class="nav-dropdown-wrapper">
          <a href="#projects" class="nav-top-link" id="navProjectsTrigger">Projects</a>
        </div>

        <a href="#bottom" class="top-arrow-hitbox">↓</a>
      </div>
    </div>
  </div>
</div>

<!-- DETACHED ROOT-LEVEL DROPDOWN -->
<div class="project-dropdown-menu" id="detachedProjectDropdown" style="position: fixed; z-index: 9999;">
  <style>
    #detachedProjectDropdown {
      width: max-content !important;
      min-width: 120px !important;
      border-radius: 14px !important;
      padding: 0px 5px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
      isolation: isolate !important;
      overflow: hidden !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
      
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translateY(-8px) scale(0.97) !important;
      transition: transform 0.25s ease-out, opacity 0.25s ease-out, visibility 0.25s ease-out !important;
      will-change: transform, opacity, backdrop-filter !important;
    }

    #detachedProjectDropdown.dropdown-is-open {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      transform: translateY(0px) scale(1) !important;
    }

    #detachedProjectDropdown .dropdown-item {
      color: var(--color-neutral-100, white) !important;
      text-decoration: none !important;
      font-size: 0.85rem !important;
      font-weight: 500 !important;
      padding: 5px 6px !important;
      border-radius: 8px !important;
      white-space: nowrap !important;
      text-align: center !important;
      background: transparent !important;
      transition: transform 0.15s ease, opacity 0.15s ease !important;
      touch-action: manipulation !important;
    }
    #detachedProjectDropdown .dropdown-item:hover {
      background: transparent !important;
      transform: scale(1.03) !important;
      opacity: 0.85 !important;
    }
  </style>
  <a href="#vid-cchh" class="dropdown-item">Cosmic Cat</a>
  <a href="#vid-ed" class="dropdown-item">Epic Dragon</a>
  <a href="#vid-mb" class="dropdown-item">Monster's Ball</a>
  <a href="#vid-ld" class="dropdown-item">Lotsa Dough</a>
  <a href="#vid-cts" class="dropdown-item">Chasing the Storm</a>
  <a href="#vid-rop" class="dropdown-item">River of Prosperity</a>
  <a href="#vid-pp" class="dropdown-item">Piggy Pesos</a>
  <a href="#vid-hkd" class="dropdown-item">Hooked</a>
  <a href="#vid-llr" class="dropdown-item">Living Larger</a>
  <a href="#vid-phs" class="dropdown-item">Pirates High Seas</a>
  <a href="#vid-diar" class="dropdown-item">Ducks in a row</a>
  <a href="#vid-sd" class="dropdown-item">Snowday</a>
  <a href="#vid-al" class="dropdown-item">Amigos Locos</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const modal = document.getElementById("custom-top-nav");
    const innerNav = modal ? modal.querySelector('.top-horizontal-nav') : null;
    const closeBtn = document.getElementById("close-top-nav");
    const trigger = document.getElementById('navProjectsTrigger');
    const dropdown = document.getElementById('detachedProjectDropdown');

    if (!modal || !innerNav || !trigger || !dropdown) return;

    let lastScrollY = window.scrollY;
    let isTrackingScroll = false;
    let isHoveringTrigger = false;
    let isHoveringDropdown = false;
    let isHoveringNav = false;
    let isHoveringSearchBtn = false;
    let navHideTimeout;
    let dropdownHideTimeout;

    function closeTopNav() {
        modal.classList.remove("nav-is-open", "pointer-events-auto");
        modal.classList.add("pointer-events-none");
        hideDropdown();
        isTrackingScroll = false;
    }

    function openTopNav() {
        modal.classList.remove("pointer-events-none");
        modal.classList.add("nav-is-open", "pointer-events-auto");
        lastScrollY = window.scrollY;
        setTimeout(() => {
            isTrackingScroll = true;
        }, 250);
    }

    function handleScrollClose() {
        if (!modal.classList.contains("nav-is-open") || !isTrackingScroll) return;
        if (Math.abs(window.scrollY - lastScrollY) > 150) {
            closeTopNav();
        }
    }

    function positionDropdown() {
        const rect = trigger.getBoundingClientRect();
        const dropdownWidth = dropdown.offsetWidth;
        
        dropdown.style.setProperty('top', (rect.bottom + 3) + 'px', 'important');
        dropdown.style.setProperty('left', (rect.left + (rect.width / 2) - (dropdownWidth / 2)) + 'px', 'important');
    }

    function showDropdown() {
        positionDropdown();
        dropdown.style.transition = 'none';
        dropdown.classList.add('dropdown-is-open');
        
        requestAnimationFrame(() => {
            dropdown.style.transition = '';
        });
    }

    function hideDropdown() {
        dropdown.classList.remove('dropdown-is-open');
    }

    const observer = new MutationObserver(() => {
        if (dropdown.classList.contains('dropdown-is-open')) {
            const computed = window.getComputedStyle(innerNav);
            dropdown.style.setProperty('background', computed.background, 'important');
            dropdown.style.setProperty('backdrop-filter', computed.backdropFilter, 'important');
            dropdown.style.setProperty('-webkit-backdrop-filter', computed.webkitBackdropFilter, 'important');
        }
    });

    observer.observe(dropdown, { attributes: true, attributeFilter: ['class'] });

    const bindSearchHover = () => {
        const searchSelectors = [
            '[data-action="search-modal"]', 
            '#search-button', 
            '.search-button', 
            '.search-toggle', 
            'button[aria-label="Search"]'
        ];

        searchSelectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(btn => {
                if (btn.dataset.navHoverBound) return;

                // Handle desktop hover
                btn.addEventListener("mouseenter", () => {
                    clearTimeout(navHideTimeout);
                    isHoveringSearchBtn = true;
                    openTopNav();
                });

                btn.addEventListener("mouseleave", () => {
                    isHoveringSearchBtn = false;
                    checkNavClose();
                });

                // Handle mobile touch/click reliably without race conditions
                btn.addEventListener("pointerdown", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    clearTimeout(navHideTimeout);
                    if (modal.classList.contains("nav-is-open")) {
                        closeTopNav();
                    } else {
                        openTopNav();
                    }
                });

                btn.dataset.navHoverBound = "true";
            });
        });
    };

    bindSearchHover();
    new MutationObserver(bindSearchHover).observe(document.body, { childList: true, subtree: true });

    innerNav.addEventListener('mouseenter', () => {
        clearTimeout(navHideTimeout);
        isHoveringNav = true;
    });

    innerNav.addEventListener('mouseleave', () => {
        isHoveringNav = false;
        checkNavClose();
    });

    function checkNavClose() {
        navHideTimeout = setTimeout(() => {
            if (!isHoveringSearchBtn && !isHoveringNav && !isHoveringTrigger && !isHoveringDropdown) {
                closeTopNav();
            }
        }, 200);
    }

    if (closeBtn) {
        closeBtn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            closeTopNav();
        });
    }

    function checkDropdownClose() {
        dropdownHideTimeout = setTimeout(() => {
            if (!isHoveringTrigger && !isHoveringDropdown) {
                hideDropdown();
            }
        }, 200);
    }

    trigger.addEventListener('mouseenter', () => {
        clearTimeout(dropdownHideTimeout);
        isHoveringTrigger = true;
        showDropdown();
    });

    trigger.addEventListener('mouseleave', () => {
        isHoveringTrigger = false;
        checkDropdownClose();
    });

    dropdown.addEventListener('mouseenter', () => {
        clearTimeout(dropdownHideTimeout);
        isHoveringDropdown = true;
    });

    dropdown.addEventListener('mouseleave', () => {
        isHoveringDropdown = false;
        checkDropdownClose();
    });

    trigger.addEventListener('pointerdown', (e) => {
        const isOpen = dropdown.classList.contains('dropdown-is-open');
        e.preventDefault();
        e.stopPropagation();
        if (!isOpen) {
            showDropdown();
        } else {
            const href = trigger.getAttribute('href');
            if (href && href.startsWith('#')) {
                const target = document.querySelector(href);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    history.pushState(null, null, href);
                }
            }
            closeTopNav();
        }
    });

    window.addEventListener('resize', () => {
        if (dropdown.classList.contains('dropdown-is-open')) {
            positionDropdown();
        }
    });

    modal.querySelectorAll('.nav-top-link, .top-arrow-hitbox').forEach(link => {
        if (link === trigger) return; 
        link.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
            e.preventDefault();
            const href = this.getAttribute('href');
            if (href && href.startsWith('#')) {
                const target = document.querySelector(href);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    history.pushState(null, null, href);
                }
            }
            closeTopNav();
        });
    });

    dropdown.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
            e.preventDefault();
            const href = this.getAttribute('href');
            if (href && href.startsWith('#')) {
                const target = document.querySelector(href);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    history.pushState(null, null, href);
                }
            }
            closeTopNav();
        });
    });

    window.addEventListener("scroll", handleScrollClose, { passive: true });
});
</script>

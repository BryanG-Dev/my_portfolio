<div 
  id="custom-top-nav" 
  class="pointer-events-none fixed inset-x-0 top-0 z-50 flex flex-col items-center justify-start opacity-0"
  style="transform: translateY(-20px); transition: transform 0.3s ease-out, opacity 0.3s ease-out;"
>
  <style>
    #custom-top-nav .top-horizontal-nav {
      margin-top: 16px !important;
      width: calc(100% - 2rem) !important;
      max-width: 42rem !important;
      
      /* KNOB 1: Container padding (Shorthand: TOP RIGHT BOTTOM LEFT)
        Increase that first '1.5rem' to '1.8rem' or '2rem' if you want 
        to push the links further down away from the top edge.
      */
      padding: 1.5rem 1.5rem 1rem 1.5rem !important; 
      
      border-radius: 14px !important;
      backdrop-filter: blur(12px) !important;
      background: color-mix(in srgb, rgba(96, 165, 250, 0.05), currentColor 10%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }

    .dark #custom-top-nav .top-horizontal-nav {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    #custom-top-nav .top-nav-container {
      position: relative !important;
      width: 100% !important;
    }

    #custom-top-nav .top-nav-flex-row {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: space-between !important; 
      width: 100% !important;
      gap: 4px !important; 
    }

    @media (min-width: 480px) {
      #custom-top-nav .top-nav-flex-row {
        gap: 12px !important;
      }
    }

    #custom-top-nav .nav-top-link {
      color: var(--color-neutral-100, white) !important;
      text-decoration: none !important;
      font-size: 0.8rem !important; 
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      display: inline-block !important;
      padding: 6px 4px !important;
      margin: 0 !important; 
      white-space: nowrap !important;
      transition: all 0.2s ease !important;
    }

    @media (min-width: 480px) {
      #custom-top-nav .nav-top-link {
        font-size: 0.95rem !important;
        padding: 6px 12px !important;
      }
    }

    #custom-top-nav .nav-top-link:hover {
      transform: scale(1.05) !important;
      opacity: 0.85 !important;
    }

    #custom-top-nav .top-nav-arrow-hitbox {
      display: inline-block !important;
      text-align: center !important;
      font-weight: bold !important;
      font-size: 16px !important;
      text-decoration: none !important;
      color: var(--color-neutral-100, white) !important; 
      padding: 4px 6px !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
    }

    @media (min-width: 480px) {
      #custom-top-nav .top-nav-arrow-hitbox {
        font-size: 20px !important;
        padding: 0px 8px 4px 8px !important;
      }
    }

    #custom-top-nav .top-nav-arrow-hitbox:hover {
      transform: scale(1.05) !important;
    }

    /* Core shared button settings */
    #custom-top-nav .close-top-btn {
      position: absolute !important;
      background: none !important;
      border: none !important;
      color: #a3a3a3 !important;
      cursor: pointer !important;
      margin: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: color 0.2s ease, transform 0.2s ease !important;
    }
    #custom-top-nav .close-top-btn:hover {
      color: #e5e5e5 !important;
      transform: scale(1.05) !important;
    }


    /* ============================================================
       THE MOBILE INTERACTION KNOBS (Screens SMALLER than 480px)
       ============================================================ */
    @media (max-width: 479px) {
      #custom-top-nav .close-top-btn {
        
        /* ADJUST THESE TWO LINE CONFIGURATIONS BELOW FOR MOBILE */
        right: -1.05rem !important;  /* Negative numbers push right, positive pulls left */
        top: -1.9rem !important;     /* More negative pushes it up toward the top rim */
        
        font-size: 1.0rem !important; 
        padding: 4px !important;
      }
    }


    /* ============================================================
       THE DESKTOP INTERACTION KNOBS (Screens WIDER than 480px)
       ============================================================ */
    @media (min-width: 480px) {
      #custom-top-nav .close-top-btn {
        
        right: -2.6rem !important; 
        top: -2.0rem !important;   
        
        font-size: 1rem !important;  
        padding: 6px !important;
      }
    }

    @media (min-width: 480px) {
      #custom-top-nav .top-horizontal-nav {
        /* Increases right padding from 1.5rem to 2.5rem, 
           widening the glass card on the right side only */
        padding-right: 2.8rem !important; 
      }
    }

  </style>

  <div class="top-horizontal-nav">
    <div class="top-nav-container">
      
      <button 
        id="close-top-nav"
        class="close-top-btn"
        aria-label="Close Navigation"
      >
        ✕
      </button>

      <div class="top-nav-flex-row">
        <a href="#about" class="nav-top-link">About Me</a>
        <a href="#experience" class="nav-top-link">Experience</a>
        <a href="#education" class="nav-top-link">Education</a>
        <a href="#projects" class="nav-top-link">Projects</a>
        <a href="#bottom" class="top-nav-arrow-hitbox">↓</a>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  const initCustomNav = () => {
    const modal = document.getElementById("custom-top-nav");
    const closeBtn = document.getElementById("close-top-nav");
    if (!modal) return;

    let lastScrollY = window.scrollY;
    let isTrackingScroll = false;
    let isNavigating = false; 

    function closeTopNav() {
      modal.classList.remove("opacity-100", "pointer-events-auto");
      modal.classList.add("opacity-0", "pointer-events-none");
      modal.style.transform = "translateY(-20px)";
      isTrackingScroll = false;
    }

    function toggleTopNav(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      const isOpen = modal.classList.contains("opacity-100");
      if (isOpen) {
        closeTopNav();
      } else {
        modal.classList.remove("opacity-0", "pointer-events-none");
        modal.classList.add("opacity-100", "pointer-events-auto");
        modal.style.transform = "translateY(0px)";
        
        lastScrollY = window.scrollY;
        setTimeout(() => {
          isTrackingScroll = true;
        }, 250); 
      }
    }

    function handleScrollClose() {
      if (!modal.classList.contains("opacity-100") || !isTrackingScroll || isNavigating) return;
      
      const currentScrollY = window.scrollY;
      const scrollDelta = Math.abs(currentScrollY - lastScrollY);
      if (scrollDelta > 150) {
        closeTopNav();
      }
    }

    const bindSearchButtons = () => {
      const searchSelectors = [
        '[data-action="search-modal"]',
        '#search-button',
        '.search-button',
        '.search-toggle',
        'button[aria-label="Search"]'
      ];

      searchSelectors.forEach(selector => {
        document.querySelectorAll(selector).forEach(btn => {
          if (btn.dataset.navBound) return; 
          btn.addEventListener("click", toggleTopNav);
          btn.addEventListener("touchstart", toggleTopNav, { passive: false });
          btn.dataset.navBound = "true";
        });
      });
    };

    bindSearchButtons();
    
    document.addEventListener("click", (e) => {
      if (!modal.classList.contains("opacity-100")) return;
      const clickedInsideNav = e.target.closest('#custom-top-nav');
      const clickedAButton = e.target.closest('[data-navBound="true"]');
      
      if (!clickedInsideNav && !clickedAButton) {
        closeTopNav();
      }
    }, true);

    if (closeBtn) {
      closeBtn.addEventListener("click", toggleTopNav);
      closeBtn.addEventListener("touchstart", toggleTopNav, { passive: false });
    }
    
    modal.querySelectorAll('.nav-top-link, .top-nav-arrow-hitbox').forEach(link => {
      const handleLinkNavigation = () => {
        isNavigating = true; 
        
        setTimeout(() => {
          closeTopNav();
          isNavigating = false;
        }, 400); 
      };
      link.addEventListener('click', handleLinkNavigation);
    });

    window.addEventListener("scroll", handleScrollClose, { passive: true });

    const observer = new MutationObserver(bindSearchButtons);
    observer.observe(document.body, { childList: true, subtree: true });
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initCustomNav);
  } else {
    initCustomNav();
  }
})();
</script>

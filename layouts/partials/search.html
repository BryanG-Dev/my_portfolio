<div 
  id="custom-top-nav" 
  class="pointer-events-none fixed inset-x-0 top-0 z-50 flex flex-col items-center justify-start opacity-0"
  style="transform: translateY(-20px); transition: transform 0.3s ease-out, opacity 0.3s ease-out;"
>
  <style>
    #custom-top-nav .top-horizontal-nav {
      margin-top: 16px !important;
      width: calc(100% - 2rem) !important;
      max-width: 42rem !important;
      padding: 1rem 2.5rem 1rem 1.25rem !important; /* Adjusted padding for better button clearance */
      border-radius: 14px !important;
      backdrop-filter: blur(12px) !important;
      background: color-mix(in srgb, rgba(96, 165, 250, 0.05), currentColor 10%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04) !important;
    }

    .dark #custom-top-nav .top-horizontal-nav {
      border-color: rgba(0, 0, 0, 0.1) !important;
    }

    #custom-top-nav .top-nav-container {
      position: relative !important;
      width: 100% !important;
    }

    #custom-top-nav .top-nav-flex-row {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      justify-content: space-evenly !important; /* Use flexible distribution instead of fixed margins */
      width: 100% !important;
      gap: 8px !important; /* Base gap protection */
    }

    #custom-top-nav .nav-top-link {
      color: var(--color-neutral-100, white) !important;
      text-decoration: none !important;
      font-size: 0.85rem !important; /* Sightly smaller baseline for sleek mobile fit */
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      display: inline-block !important;
      padding: 6px 4px !important;
      margin: 0 !important; /* Nuke the fixed margins breaking mobile lines */
      white-space: nowrap !important;
      transition: all 0.2s ease !important;
    }

    /* Scale fonts up for larger viewports smoothly */
    @media (min-width: 480px) {
      #custom-top-nav .nav-top-link {
        font-size: 0.95rem !important;
        padding: 6px 12px !important;
      }
    }

    #custom-top-nav .nav-top-link:hover {
      transform: scale(1.05) !important;
      opacity: 0.85 !important;
    }

    #custom-top-nav .close-top-btn {
      position: absolute !important;
      right: -1.25rem !important; /* Shifted safely contextually inside mobile wrapper */
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: none !important;
      border: none !important;
      color: #a3a3a3 !important;
      cursor: pointer !important;
      font-size: 1.1rem !important;
      padding: 5px !important;
      transition: color 0.2s ease !important;
    }

    #custom-top-nav .close-top-btn:hover {
      color: #e5e5e5 !important;
    }

    #custom-top-nav .top-nav-arrow-hitbox {
      display: inline-block !important;
      text-align: center !important;
      font-weight: bold !important;
      font-size: 20px !important;
      text-decoration: none !important;
      color: var(--color-neutral-100, white) !important; 
      padding: 0px 8px 4px 8px !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
    }

    #custom-top-nav .top-nav-arrow-hitbox:hover {
      transform: scale(1.05) !important;
    }
  </style>

  <div class="top-horizontal-nav">
    <div class="top-nav-container">
      
      <div class="top-nav-flex-row">
        <a href="#about" class="nav-top-link">About Me</a>
        <a href="#experience" class="nav-top-link">Experience</a>
        <a href="#education" class="nav-top-link">Education</a>
        <a href="#projects" class="nav-top-link">Projects</a>
        <a href="#bottom" class="top-nav-arrow-hitbox">↓</a>
      </div>

      <button 
        id="close-top-nav"
        class="close-top-btn"
        aria-label="Close Navigation"
      >
        ✕
      </button>

    </div>
  </div>
</div>

<script>
(function () {
  // Use a unified function to run initialization safely
  const initCustomNav = () => {
    const modal = document.getElementById("custom-top-nav");
    const closeBtn = document.getElementById("close-top-nav");
    if (!modal) return;

    let lastScrollY = window.scrollY;
    let isTrackingScroll = false;

    function closeTopNav() {
      modal.classList.remove("opacity-100", "pointer-events-auto");
      modal.classList.add("opacity-0", "pointer-events-none");
      modal.style.transform = "translateY(-20px)";
      isTrackingScroll = false;
    }

    function toggleTopNav(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      
      const isOpen = modal.classList.contains("opacity-100");
      if (isOpen) {
        closeTopNav();
      } else {
        modal.classList.remove("opacity-0", "pointer-events-none");
        modal.classList.add("opacity-100", "pointer-events-auto");
        modal.style.transform = "translateY(0px)";
        
        lastScrollY = window.scrollY;
        setTimeout(() => {
          isTrackingScroll = true;
        }, 200); // Slightly increased delay for mobile engine processing
      }
    }

    function handleScrollClose() {
      if (!modal.classList.contains("opacity-100") || !isTrackingScroll) return;
      const currentScrollY = window.scrollY;
      const scrollDelta = Math.abs(currentScrollY - lastScrollY);
      if (scrollDelta > 150) {
        closeTopNav();
      }
    }

    // Unified Click & Touch Handler for opening and closing contextually
    function handleTrigger(e) {
      const nativeSearchBtn = e.target.closest('[data-action="search-modal"]') || 
                             e.target.closest('#search-button') ||
                             e.target.closest('.search-button');
      
      if (nativeSearchBtn) {
        toggleTopNav(e);
        return;
      }

      // If navigation is active and the event clicked completely outside of its element wrapper, shut it down
      if (modal.classList.contains("opacity-100")) {
        const clickedInsideNav = modal.contains(e.target);
        if (!clickedInsideNav) {
          closeTopNav();
        }
      }
    }

    // Bind both click and touchstart to intercept native mobile behavior instantly
    document.addEventListener("click", handleTrigger, true);
    document.addEventListener("touchstart", handleTrigger, { passive: false, capture: true });

    if (closeBtn) {
      closeBtn.addEventListener("click", toggleTopNav);
      closeBtn.addEventListener("touchstart", toggleTopNav, { passive: false });
    }
    
    modal.querySelectorAll('.nav-top-link, .top-nav-arrow-hitbox').forEach(link => {
      const linkClose = () => setTimeout(closeTopNav, 120);
      link.addEventListener('click', linkClose);
      link.addEventListener('touchstart', linkClose, { passive: true });
    });

    window.addEventListener("scroll", handleScrollClose, { passive: true });
  };

  // Run immediately and also bind to DOMContentLoaded to guarantee execution in Hugo environments
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initCustomNav);
  } else {
    initCustomNav();
  }
})();
</script>

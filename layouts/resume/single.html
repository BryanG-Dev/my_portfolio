<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      overflow-x: hidden;
      width: 100%;
      background-color: #f4f4f4; /* Optional: light grey background */
    }

    .top {
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .btn {
      display: inline-flex; /* Changed to flex for proper icon + text alignment */
      align-items: center;
      justify-content: center;
      gap: 0.4rem; /* Exactly matches main site gap layout */
      padding: 12px 24px;
      border-radius: 8px;
      background: #746d7b8b;
      color: white;
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #7c6394a7;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* THE WRAPPER: Handles the container height and mobile touch scrolling */
    .resume-wrapper {
      width: 100%;
      /* Height is Screen Height minus the height of your .top bar */
      height: calc(100vh - 85px); 
      overflow: auto;
      -webkit-overflow-scrolling: touch; 
      background: #525659; /* Matches standard PDF viewer dark grey */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <div class="top">
    <a class="btn" href="/bgresume2026.pdf" download>
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
      </svg>
      <span>Download Resume</span>
    </a>
  </div>

  <div class="resume-wrapper">
    <iframe src="/bgresume2026.pdf"></iframe>
  </div>

</body>
</html>
